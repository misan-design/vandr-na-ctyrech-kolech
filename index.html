<style>
/* Layout: trail-signpost identity. Full-bleed photo bands, content in a 1120px column,
   Czech tourist-trail stripe (white-color-white) as the recurring marker. */
:root{
  --bg:#EEF1EA;          /* mountain fog, green-biased */
  --surface:#FFFFFF;
  --surface-2:#E2E8DC;
  --fg:#1B2620;          /* spruce night */
  --muted:#56645A;
  --line:#C9D3C3;
  --forest:#24452F;      /* primary: Beskydy spruce */
  --forest-ink:#F3F6F0;
  --ochre:#B7731F;       /* accent: beech leaves in October */
  --ochre-soft:#F1DFC4;
  --booked:#B7B9B3;
  --booked-ink:#5E625C;
  --sel:#24452F;
  --sel-ink:#FFFFFF;
  --range:#CFE0C8;
  --trail-red:#C8102E; --trail-blue:#0B57B0; --trail-green:#1D8A3B; --trail-yellow:#E9B800;
  --sign:#FFFFFF; --sign-ink:#1B2620;
  --badge-green:#1E6B37; --badge-ochre:#D8913A; --badge-blue:#0B57B0;
  --shadow:0 1px 2px rgba(20,35,25,.08),0 8px 24px rgba(20,35,25,.08);
  --f-display:"Barlow Condensed","Arial Narrow",Roboto Condensed,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101814;--surface:#17221C;--surface-2:#1F2D25;--fg:#E4EBE1;--muted:#9DAB9F;--line:#2D3D33;
  --forest:#8DBE8F;--forest-ink:#0F1913;--ochre:#E1A04E;--ochre-soft:#3A2A16;
  --booked:#3A423D;--booked-ink:#8E978F;--sel:#8DBE8F;--sel-ink:#0F1913;--range:#2C4434;
  --sign:#1F2D25;--sign-ink:#E4EBE1;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101814;--surface:#17221C;--surface-2:#1F2D25;--fg:#E4EBE1;--muted:#9DAB9F;--line:#2D3D33;
  --forest:#8DBE8F;--forest-ink:#0F1913;--ochre:#E1A04E;--ochre-soft:#3A2A16;
  --booked:#3A423D;--booked-ink:#8E978F;--sel:#8DBE8F;--sel-ink:#0F1913;--range:#2C4434;
  --sign:#1F2D25;--sign-ink:#E4EBE1;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.68}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--forest)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.02;text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2.6rem,7vw,4.6rem);text-transform:uppercase}
h2{font-size:clamp(2rem,4.6vw,3rem);text-transform:uppercase}
h3{font-size:1.5rem}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.95rem;color:var(--ochre);display:flex;align-items:center;gap:10px}
.lead{font-size:1.18rem;line-height:1.7;color:var(--muted);max-width:60ch}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}

/* trail marker: white | color | white */
.mark{display:inline-flex;flex-direction:column;width:26px;height:18px;border-radius:2px;overflow:hidden;flex:none;box-shadow:0 0 0 1px var(--line)}
.mark i{flex:1;background:#fff}.mark i:nth-child(2){background:var(--c,var(--trail-red))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);font-family:var(--f-display);font-weight:800;font-size:1.65rem;text-transform:uppercase;letter-spacing:.02em}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{text-decoration:none;color:var(--fg);font-family:var(--f-display);font-weight:600;font-size:1.12rem;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-radius:6px}
nav.main a:hover{background:var(--surface-2)}
nav.main a[aria-current="page"]{color:var(--forest);box-shadow:inset 0 -3px 0 var(--ochre)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .85rem/1 var(--f-body);padding:8px 8px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink)}
.menu-btn{display:none;margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:8px 12px;font:600 1rem var(--f-display);text-transform:uppercase;letter-spacing:.05em;cursor:pointer}
@media (max-width:860px){
  .menu-btn{display:block}
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--surface);flex-direction:column;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  nav.main.open{display:flex}
  nav.main a{padding:12px 8px}
}
.lang-m{display:none;align-self:flex-start;margin-top:8px}
@media (max-width:560px){.top .lang{display:none}.lang-m{display:flex}}
.note-lang{background:var(--ochre-soft);color:var(--fg);font-size:.92rem}
.note-lang .wrap{padding-block:8px}

/* hero */
.hero{position:relative;min-height:clamp(440px,70vh,640px);display:flex;align-items:flex-end;color:#fff;background:#1d2a22 center/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,20,14,.25) 0%,rgba(10,20,14,.45) 40%,rgba(10,20,14,.85) 100%)}
.hero .wrap{position:relative;z-index:1;padding-block:clamp(56px,8vw,88px);width:100%}
.hero h1{max-width:13ch;color:#fff}
.hero p{max-width:46ch;font-size:1.2rem;line-height:1.65;margin-top:20px;color:#EEF2EC}
.hero .eyebrow{color:#F3C987}
.btns{display:flex;flex-wrap:wrap;gap:14px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:8px;padding:13px 20px;font:700 1.1rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;cursor:pointer}
.btn-primary{background:var(--ochre);color:#1B1408}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.btn-solid{background:var(--forest);color:var(--forest-ink)}
.btn-line{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}

section.band{padding-block:clamp(56px,8vw,112px)}
section.band.alt{background:var(--surface)}
.sec-head{display:grid;gap:14px;margin-bottom:clamp(28px,4vw,48px)}

/* signpost */
.post{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(40px,6vw,72px);align-items:center}
@media (max-width:820px){.post{grid-template-columns:1fr}}
.signs{display:grid;gap:14px;position:relative;padding-left:18px}
.signs::before{content:"";position:absolute;left:0;top:-12px;bottom:-24px;width:8px;border-radius:3px;background:var(--muted);opacity:.5}
.sign{display:flex;align-items:center;gap:12px;background:var(--sign);color:var(--sign-ink);border-radius:3px 26px 26px 3px;padding:10px 26px 10px 14px;box-shadow:var(--shadow);font-family:var(--f-display);font-weight:600;font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em}
.sign .km{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500;white-space:nowrap}
.sign .place{min-width:0}
.sign small{display:block;font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:.85rem;color:var(--muted);font-weight:400}
.fine{font-size:.88rem;color:var(--muted)}

/* vehicle cards */
.vcard{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.vcard img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/3;display:block}
.vcard .body{padding:clamp(24px,4vw,44px);display:grid;gap:22px;align-content:start;min-width:0}
@media (max-width:760px){.vcard{grid-template-columns:1fr}}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.vlist{display:grid;gap:32px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.92rem;font-weight:600}
.aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:clamp(20px,3vw,32px)}
.aud-c{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,3.5vw,36px);display:grid;gap:16px;align-content:start;justify-items:start}
.aud-c p{color:var(--muted)}
.price{font-family:var(--f-display);font-size:1.3rem;font-weight:600;text-transform:uppercase;color:var(--ochre);letter-spacing:.03em}

/* audience badges: solid pills */
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 15px 7px 12px;font:700 .98rem/1 var(--f-body);letter-spacing:.01em;white-space:nowrap}
.badge svg{width:18px;height:18px;flex:none}
.badge.b-two{background:var(--badge-green);color:#FFFFFF}
.badge.b-family{background:var(--badge-ochre);color:#1B1408}
.badge.b-party{background:var(--badge-blue);color:#FFFFFF}

/* steps (a real sequence) */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(28px,4vw,40px);counter-reset:s}
.steps li{counter-increment:s;display:grid;gap:12px;align-content:start;padding-top:22px;border-top:3px solid var(--forest)}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--ochre)}
.steps b{font-family:var(--f-display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.steps p{color:var(--muted)}

/* vehicle page */
.gallery{display:grid;gap:14px}
.gallery .main-img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r);display:block;background:var(--surface-2);cursor:zoom-in}
.main-wrap{position:relative}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;border:0;display:grid;place-items:center;cursor:pointer;background:rgba(15,25,19,.55);color:#fff;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .15s}
.gal-nav:hover{background:rgba(15,25,19,.8)}
.gal-nav svg{width:24px;height:24px}
.gal-prev{left:12px}.gal-next{right:12px}
.gal-count{position:absolute;right:12px;bottom:12px;background:rgba(15,25,19,.6);color:#fff;font:600 .85rem/1 var(--f-body);padding:6px 10px;border-radius:999px;font-variant-numeric:tabular-nums;pointer-events:none}
.lb .gal-nav{position:fixed;top:50%;right:auto;padding:0;border-radius:999px;color:#fff;background:rgba(255,255,255,.16)}
.lb .gal-nav:hover{background:rgba(255,255,255,.3)}
.lb .gal-prev{left:max(12px,env(safe-area-inset-left,0px))}.lb .gal-next{left:auto;right:max(12px,env(safe-area-inset-right,0px))}
.lb .gal-count{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:auto;left:50%;transform:translateX(-50%)}
@media (max-width:560px){.gal-nav{width:42px;height:42px}.gal-prev{left:8px}.gal-next{right:8px}}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.thumbs button{padding:0;border:0;border-radius:6px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:var(--surface-2);opacity:.75}
.thumbs button[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 3px var(--ochre)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.vgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(40px,6vw,64px);align-items:start}
.vblock{margin-top:clamp(64px,9vw,104px);display:grid;gap:28px}
@media (max-width:900px){.vgrid{grid-template-columns:1fr}}
table.spec{width:100%;border-collapse:collapse;font-size:1rem}
.spec th,.spec td{text-align:left;padding:13px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spec th{font-weight:600;color:var(--muted);width:46%;padding-right:12px}
.spec td{font-variant-numeric:tabular-nums}
.equip{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.equip li{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border-radius:8px;padding:18px 20px;border:1px solid var(--line)}
.equip li span.ic{flex:none;width:28px;height:28px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;color:var(--forest)}
.equip li svg{width:18px;height:18px}
.equip li div{min-width:0}
.equip small{display:block;color:var(--muted);font-size:.88rem}

/* calendar */
.cal-box{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(18px,3.5vw,32px);display:grid;gap:22px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-nav button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;width:40px;height:40px;font-size:1.2rem;cursor:pointer}
.cal-nav button:disabled{opacity:.35;cursor:default}
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
@media (max-width:640px){.months{grid-template-columns:1fr}.months .m:nth-child(2){display:none}}
.m h4{margin:0 0 8px;font-family:var(--f-display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{font-size:.78rem;color:var(--muted);text-align:center;font-weight:600;padding-bottom:4px;text-transform:uppercase}
.day{aspect-ratio:1;border:0;border-radius:6px;background:transparent;color:var(--fg);font:600 .98rem var(--f-body);font-variant-numeric:tabular-nums;cursor:pointer;min-width:0;padding:0}
.day:hover:not(:disabled):not(.sel):not(.inrange){background:var(--surface-2)}
.day.past{color:var(--muted);opacity:.45;cursor:default}
.day.booked{background:var(--booked);color:var(--booked-ink);text-decoration:line-through;cursor:not-allowed}
.day.inrange{background:var(--range);border-radius:0}
.day.sel{background:var(--sel);color:var(--sel-ink)}
.day.today{box-shadow:inset 0 0 0 2px var(--ochre)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.9rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}
.cal-status{font-weight:600;min-height:1.5em}
.cal-status.err{color:var(--trail-red)}

/* faq */
.faq{display:grid;gap:14px;max-width:820px}
.faq details{background:var(--surface);border-radius:8px;border:1px solid var(--line)}
.faq summary{cursor:pointer;padding:20px 24px;font-weight:700;font-size:1.08rem;list-style:none;display:flex;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-left:auto;font-family:var(--f-display);font-size:1.6rem;color:var(--ochre);line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{padding:0 24px 22px;color:var(--muted);max-width:65ch}

/* contact */
.cgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(40px,6vw,72px);align-items:start}
@media (max-width:900px){.cgrid{grid-template-columns:1fr}}
form.inq{display:grid;gap:20px;background:var(--surface);padding:clamp(22px,4vw,40px);border-radius:var(--r);box-shadow:var(--shadow)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
label.f{display:grid;gap:8px;font-weight:600;font-size:.95rem;min-width:0}
label.f input,label.f select,label.f textarea{font:400 1rem var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:11px 12px;width:100%;min-width:0}
label.f textarea{min-height:110px;resize:vertical}
.xf{border:1px solid var(--line);border-radius:7px;padding:10px 14px 14px;margin:0;min-width:0}
.xf legend{font-weight:600;font-size:.95rem;padding:0 4px}
.xchecks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px}

.handoff{display:grid;gap:16px;background:var(--ochre-soft);border-radius:var(--r);padding:20px}
.sent-ok{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:1.08rem;color:var(--fg);margin:0}.sent-ok svg{width:22px;height:22px;flex:none;color:var(--forest);margin-top:2px}

/* admin */

  faq: [
    [{cs:"Jaký řidičský průkaz potřebuji?",en:"What driving licence do I need?",sk:"Aký vodičský preukaz potrebujem?",de:"Welchen Führerschein brauche ich?"},
     {cs:"Stačí skupina B. Vůz má celkovou hmotnost 3 500 kg.",en:"A standard category B licence is enough. The van's gross weight is 3,500 kg.",sk:"Stačí skupina B. Vozidlo má celkovú hmotnosť 3 500 kg.",de:"Klasse B genügt. Das zulässige Gesamtgewicht beträgt 3.500 kg."}],
    [{cs:"Kolik lidí se ve voze vyspí?",en:"How many people can sleep in the van?",sk:"Koľko ľudí sa vo vozidle vyspí?",de:"Wie viele Personen können im Fahrzeug schlafen?"},
     {cs:"Až čtyři. Napříč autem jsou dvě pevná lůžka dlouhá přibližně 170 cm a podélně lze rozložit manželskou postel dlouhou přibližně 200 cm. Všechna lůžka můžete používat současně.",
      en:"Up to four. Two fixed berths (approx. 170 cm) run across the van, and a double bed (approx. 200 cm) folds out lengthwise. All berths can be used at the same time.",
      sk:"Až štyria. Naprieč autom sú dve pevné lôžka dlhé približne 170 cm a pozdĺžne sa dá rozložiť manželská posteľ dlhá približne 200 cm. Všetky lôžka môžete používať súčasne.",
      de:"Bis zu vier. Quer liegen zwei feste Betten (ca. 170 cm), in Längsrichtung lässt sich ein Doppelbett (ca. 200 cm) ausklappen. Alle Betten können gleichzeitig genutzt werden."}],
    [{cs:"Kolik lidí může jet?",en:"How many people can travel?",sk:"Koľko ľudí môže cestovať?",de:"Wie viele Personen können mitfahren?"},
     {cs:"Sedm: tři vepředu a čtyři na zadní lavici. Když zadní sedačky vyndáme, jedou tři.",en:"Seven: three in front and four on the rear bench. If we remove the rear seats, three people can travel.",sk:"Sedem: traja vpredu a štyria na zadnej lavici. Keď zadné sedadlá vyberieme, cestujú traja.",de:"Sieben: drei vorne und vier auf der Rückbank. Ohne Rücksitze fahren drei Personen mit."}],
    [{cs:"Můžete vyndat zadní sedačky?",en:"Can you remove the rear seats?",sk:"Môžete vybrať zadné sedadlá?",de:"Können Sie die Rücksitze ausbauen?"},
     {cs:"Ano, na přání. Zadní lavici vyndáme a necháme u nás, uvnitř je pak víc místa. Jet ale můžou jen tři lidé na předních sedačkách. Domluvte se s námi předem, ideálně už v poptávce.",
      en:"Yes, on request. We take out the rear bench and keep it for you, which gives you more room inside. Only three people can then travel, on the front seats. Please let us know in advance, ideally in your enquiry.",
      sk:"Áno, na želanie. Zadnú lavicu vyberieme a necháme u nás, vnútri je potom viac miesta. Cestovať však môžu len traja ľudia na predných sedadlách. Dohodnite sa s nami vopred, ideálne už v dopyte.",
      de:"Ja, auf Wunsch. Wir bauen die Rückbank aus und lagern sie bei uns – so haben Sie mehr Platz. Dann können nur drei Personen auf den Vordersitzen mitfahren. Bitte sagen Sie uns vorher Bescheid, am besten schon in Ihrer Anfrage."}],
    [{cs:"Jedeme ve čtyřech dospělých. Vejdeme se?",en:"We are four adults. Will we fit?",sk:"Ideme štyria dospelí. Zmestíme sa?",de:"Wir sind vier Erwachsene. Passen wir hinein?"},
     {cs:"Spát můžete všichni ve voze, lůžka jdou použít současně. Pevná lůžka mají přibližně 170 cm, takže záleží na vaší výšce. V létě si můžete přibalit stan – vlastní, nebo náš stan pro dva za příplatek. Při jízdě ve čtyřech musí zadní sedačky zůstat ve voze.",
      en:"Yes, all four of you can sleep in the van – the berths can be used at the same time. The fixed berths are approx. 170 cm long, so it depends on your height. In summer you can bring a tent – your own, or our two-person tent for an extra charge. With four people on board, the rear seats must stay in.",
      sk:"Spať môžete všetci vo vozidle, lôžka sa dajú používať súčasne. Pevné lôžka majú približne 170 cm, takže záleží od vašej výšky. V lete si môžete pribaliť stan – vlastný, alebo náš stan pre dvoch za príplatok. Pri jazde vo štyroch musia zadné sedadlá zostať vo vozidle.",
      de:"Ja, alle vier können im Fahrzeug schlafen, die Betten lassen sich gleichzeitig nutzen. Die festen Betten sind ca. 170 cm lang – es kommt also auf Ihre Körpergröße an. Im Sommer können Sie ein Zelt mitnehmen – Ihr eigenes oder gegen Aufpreis unser Zweipersonenzelt. Zu viert müssen die Rücksitze eingebaut bleiben."}],
    [{cs:"Dá se ve voze vařit?",en:"Can I cook in the van?",sk:"Dá sa vo vozidle variť?",de:"Kann man im Fahrzeug kochen?"},
     {cs:"Ano. Kuchyňka má dřez, vařič, plynové kartuše, ledničku a základní nádobí: talíře, misky, příbory, hrnec, pánev a hrnky.",en:"Yes. The kitchenette has a sink, stove, gas cartridges, a fridge and basic cookware: plates, bowls, cutlery, a pot, a pan and mugs.",sk:"Áno. Kuchynka má drez, varič, plynové kartuše, chladničku a základný riad: taniere, misky, príbory, hrniec, panvicu a hrnčeky.",de:"Ja. Die Küchenzeile hat Spüle, Kocher, Gaskartuschen, Kühlschrank und Grundausstattung: Teller, Schüsseln, Besteck, Topf, Pfanne und Tassen."}],
    [{cs:"Je ve voze záchod a sprcha?",en:"Is there a toilet and shower?",sk:"Je vo vozidle záchod a sprcha?",de:"Gibt es Toilette und Dusche?"},
     {cs:"Je tam malé přenosné chemické WC. Sprcha ve voze není, na delší cestu doporučujeme kempy.",en:"There is a small portable chemical toilet. There is no shower – for longer trips we recommend campsites.",sk:"Je tam malé prenosné chemické WC. Sprcha vo vozidle nie je, na dlhšiu cestu odporúčame kempy.",de:"Es gibt eine kleine tragbare Chemietoilette. Eine Dusche gibt es nicht – für längere Reisen empfehlen wir Campingplätze."}],
    [{cs:"Nebude v noci zima?",en:"Won't it be cold at night?",sk:"Nebude v noci zima?",de:"Wird es nachts nicht kalt?"},
     {cs:"Vůz má nezávislé naftové topení, takže se dá jezdit i na jaře a na podzim.",en:"The van has a diesel heater, so spring and autumn trips are no problem.",sk:"Vozidlo má nezávislé naftové kúrenie, takže sa dá jazdiť aj na jar a na jeseň.",de:"Das Fahrzeug hat eine Diesel-Standheizung – auch Touren im Frühling und Herbst sind kein Problem."}],
    [{cs:"Půjčujete i vybavení na vodu?",en:"Do you rent water sports gear?",sk:"Požičiavate aj vybavenie na vodu?",de:"Verleihen Sie auch Wassersportausrüstung?"},
     {cs:"Ano. K vozu si můžete za příplatek půjčit nafukovací kánoi nebo paddleboard. Domluvte se s námi předem, stačí to zaškrtnout v poptávce. Cenu sdělíme v nabídce.",en:"Yes. You can add an inflatable canoe or a paddleboard for an extra charge. Please arrange it in advance – just tick it in your enquiry. We'll include the price in our offer.",sk:"Áno. K vozidlu si môžete za príplatok požičať nafukovaciu kanoe alebo paddleboard. Dohodnite sa s nami vopred, stačí to zaškrtnúť v dopyte. Cenu uvedieme v ponuke.",de:"Ja. Gegen Aufpreis können Sie ein aufblasbares Kanu oder ein Paddleboard dazu mieten. Bitte vorher absprechen – einfach in der Anfrage ankreuzen. Den Preis nennen wir Ihnen im Angebot."}],
    [{cs:"Můžu vzít psa nebo kolo?",en:"Can I bring a dog or a bike?",sk:"Môžem vziať psa alebo bicykel?",de:"Darf ich einen Hund oder ein Fahrrad mitnehmen?"},
     {cs:"Nosič kol ve voze je. Zvířata domlouváme individuálně, napište nám.",en:"There is a bike rack. Pets are by arrangement – just ask us.",sk:"Nosič bicyklov vozidlo má. Zvieratá dohadujeme individuálne, napíšte nám.",de:"Ein Fahrradträger ist vorhanden. Haustiere nach Absprache – schreiben Sie uns einfach."}],
    [{cs:"Kde si vůz vyzvednu?",en:"Where do I pick up the van?",sk:"Kde si vozidlo vyzdvihnem?",de:"Wo hole ich das Fahrzeug ab?"},
     {cs:"V Ostravě-Porubě, kousek od VŠB. Přesnou adresu pošleme po potvrzení rezervace.",en:"In Ostrava-Poruba, close to the VŠB university campus. We send the exact address once your booking is confirmed.",sk:"V Ostrave-Porube, kúsok od VŠB. Presnú adresu pošleme po potvrdení rezervácie.",de:"In Ostrava-Poruba, nahe der Technischen Universität VŠB. Die genaue Adresse schicken wir nach Bestätigung der Buchung."}],
    [{cs:"Kdy je termín potvrzený?",en:"When is my booking confirmed?",sk:"Kedy je termín potvrdený?",de:"Wann ist der Termin bestätigt?"},

const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromIso = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const fmtIn = (s,lg) => { const d=fromIso(s); try{ return new Intl.DateTimeFormat(LOCALE[lg],{day:"numeric",month:"numeric",year:"numeric"}).format(d); }catch(_){ return d.getDate()+". "+(d.getMonth()+1)+". "+d.getFullYear(); } };

function bookedSet(vid){
  const set = new Set();
  (AVAIL[vid]||[]).forEach(([a,b])=>{ for(let d=fromIso(a); d<=fromIso(b); d=addDays(d,1)) set.add(iso(d)); });
  return set;
}
function rangeHasBooked(vid,a,b){ const s=bookedSet(vid); for(let d=fromIso(a); d<=fromIso(b); d=addDays(d,1)) if(s.has(iso(d))) return true; return false; }
function toRanges(days){
  const arr=[...days].sort(); const out=[];
  for(const s of arr){ const last=out[out.length-1]; if(last && iso(addDays(fromIso(last[1]),1))===s) last[1]=s; else out.push([s,s]); }
  return out;
}

function parseRoute(){
  let h=(location.hash||"").replace(/^#\/?/,"")||"uvod";
  if(h==="vuz") h="vozy";
  if(h==="faq") h="vuz-"+VEHICLES[0].id+"-faq";
  if(h==="admin") return {page:"admin"};
  if(h==="soukromi") return {page:"privacy"};
  if(h.startsWith("vuz-")){
    const rest=h.slice(4);
    const v=VEHICLES.find(x=>rest===x.id||rest.startsWith(x.id+"-"));
    if(v) return {page:"vehicle", v, section: rest===v.id?null:rest.slice(v.id.length+1)};
    return {page:"home", section:"vozy"};
  }
  return {page:"home", section: HOME_SECTIONS.includes(h)?h:"uvod"};
}

function calHtml(vid, admin){
  if(!calMonth[vid]){ const d=today(); calMonth[vid]=new Date(d.getFullYear(),d.getMonth(),1); }
  const start=calMonth[vid]; const td=today(); const tdIso=iso(td);
  const booked=bookedSet(vid); const s=sel[vid]||{};
  const ML=MONTHS_L[lang]||MONTHS_L.cs, DL=DOW_L[lang]||DOW_L.cs;
  const months=[0,1].map(off=>{
    const first=new Date(start.getFullYear(),start.getMonth()+off,1);
    const lead=(first.getDay()+6)%7; const dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    let cells=DL.map(d=>'<div class="dow">'+d+'</div>').join("")+'<div></div>'.repeat(lead);
    for(let i=1;i<=dim;i++){
      const d=new Date(first.getFullYear(),first.getMonth(),i); const k=iso(d);
      const cls=["day"]; const past=d<td; const bk=booked.has(k);
      if(past) cls.push("past"); if(bk) cls.push("booked"); if(k===tdIso) cls.push("today");
      if(!admin){ if(s.a&&s.b&&k>s.a&&k<s.b) cls.push("inrange"); if(k===s.a||k===s.b) cls.push("sel"); }
      const dis = past || (!admin && bk);
      cells+='<button type="button" class="'+cls.join(" ")+'" data-d="'+k+'"'+(dis?' disabled':'')+' aria-label="'+esc(fmt(k))+(bk?' – '+esc(t("cal_booked")):'')+'">'+i+'</button>';
    }
    return '<div class="m"><h4>'+ML[first.getMonth()]+' '+first.getFullYear()+'</h4><div class="grid7">'+cells+'</div></div>';
  }).join("");
  const minMonth=new Date(td.getFullYear(),td.getMonth(),1);
  let status="", foot="";
  if(!admin){
    if(!s.a) status=t("cal_pick_start");
    else if(!s.b) status=fmt(s.a)+" → "+t("cal_pick_end");
    else { const n=Math.round((fromIso(s.b)-fromIso(s.a))/864e5); status=fmt(s.a)+" – "+fmt(s.b)+" · "+(NIGHTS[lang]||NIGHTS.cs)(n); }
    foot='<div class="btns" style="margin-top:0"><button type="button" class="btn btn-primary" data-act="ask" '+(s.a&&s.b?'':'disabled')+'>'+esc(t("cal_send"))+'</button></div>';
  }
  return '<div class="cal-box" data-cal="'+vid+'" data-admin="'+(admin?1:0)+'">'+
    '<div class="cal-nav"><button type="button" data-nav="-1" aria-label="'+esc(t("cal_prev"))+'" '+(start<=minMonth?'disabled':'')+'>‹</button>'+
    '<div class="legend"><span><i style="background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)"></i>'+esc(t("cal_free"))+'</span><span><i style="background:var(--booked)"></i>'+esc(admin?"Obsazeno (klikem přepnete)":t("cal_booked"))+'</span>'+(admin?'':'<span><i style="background:var(--sel)"></i>'+esc(t("cal_sel"))+'</span>')+'</div>'+
    '<button type="button" data-nav="1" aria-label="'+esc(t("cal_next"))+'">›</button></div>'+
    '<div class="months">'+months+'</div>'+
    (admin?'':'<p class="cal-status" aria-live="polite">'+esc(status)+'</p>'+foot)+
    (availLoaded?'':'<p class="fine">'+esc(t("cal_loading"))+'</p>')+'</div>';
}

/* ====== render & events ====== */
function scrollToId(id, smooth){
  const el=id && document.getElementById(id);
  if(el){ el.scrollIntoView({block:"start", behavior: smooth && !matchMedia("(prefers-reduced-motion: reduce)").matches ? "smooth":"auto"}); return true; }
  return false;
}
function render(opts){
  const rt=parseRoute();
  renderChrome(rt);
  const key = rt.page==="vehicle" ? "v:"+rt.v.id : rt.page;
  const app=$("#app");
  app.innerHTML = rt.page==="vehicle" ? vehicleDetail(rt.v) : rt.page==="admin" ? pageAdmin() : rt.page==="privacy" ? pagePrivacy() : pageHome();
  $("#mainNav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
  const changedPage = key!==currentPage; currentPage=key;
  setupMbar();
  if(rt.page==="vehicle") preloadPhotos(rt.v);
  if(opts && opts.keepScroll) return;
  const target = rt.page==="vehicle" ? (rt.section||null) : (rt.section==="uvod" ? null : rt.section);
  if(target){ requestAnimationFrame(()=>scrollToId(target, !changedPage)); }
  else if(changedPage || (rt.page==="home" && rt.section==="uvod")) window.scrollTo(0,0);
}
/* full-size photos load in the background so switching in the gallery is instant */
const preloaded=new Set();
function preloadPhotos(v){
  const go=()=>(v.photos||[]).forEach(p=>{ if(preloaded.has(p.src)) return; preloaded.add(p.src); const i=new Image(); i.decoding="async"; i.src=p.src; });
  if(document.readyState==="complete") setTimeout(go,300); else addEventListener("load",()=>setTimeout(go,300),{once:true});
}

  g.querySelectorAll(".thumbs button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.i===i));
  const c=$(".gal-count",g); if(c) c.textContent=(i+1)+" / "+n;
  if(lbGallery===g && !$("#lb").hidden){ $("#lbImg").src=ph.src; $("#lbImg").alt=L(ph.alt); syncLb(); }
}
function galStep(g,d){ galShow(g, galIndex(g)+d); }
function syncLb(){ if(!lbGallery) return; const v=VEHICLES.find(x=>x.id===lbGallery.dataset.v); const n=v.photos.length;
  $("#lbCount").textContent=(galIndex(lbGallery)+1)+" / "+n; ["#lbPrev","#lbNext","#lbCount"].forEach(id=>$(id).hidden=n<2); }
document.addEventListener("keydown", e=>{
  if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
  const d=e.key==="ArrowLeft"?-1:1;
  if(!$("#lb").hidden && lbGallery){ e.preventDefault(); galStep(lbGallery,d); return; }
  const g=document.activeElement && document.activeElement.closest && document.activeElement.closest(".gallery"); if(g){ e.preventDefault(); galStep(g,d); }
});
let swX=null, swY=null;
document.addEventListener("touchstart", e=>{ if(!e.target.closest(".main-wrap") && e.target.id!=="lbImg"){ swX=null; return; } swX=e.touches[0].clientX; swY=e.touches[0].clientY; }, {passive:true});
document.addEventListener("touchend", e=>{ if(swX===null) return; const dx=e.changedTouches[0].clientX-swX, dy=e.changedTouches[0].clientY-swY; const tgt=e.target; swX=null;
  if(Math.abs(dx)<45 || Math.abs(dx)<Math.abs(dy)*1.3) return;
  const g = tgt.id==="lbImg" ? lbGallery : tgt.closest(".gallery"); if(g) galStep(g, dx<0?1:-1); }, {passive:true});
window.addEventListener("hashchange", ()=>render());

/* keep typed form values across a language switch */
function snapshotForm(){
  const f=$("#inq"); if(!f) return null;
  const o={}; f.querySelectorAll("input,select,textarea").forEach(el=>{ o[el.id]= el.type==="checkbox"?el.checked:el.value; }); return o;
}
function restoreForm(o){
  if(!o) return; Object.keys(o).forEach(id=>{ const el=document.getElementById(id); if(!el) return; if(el.type==="checkbox") el.checked=o[id]; else el.value=o[id]; });
}

let dirtyAdmin=null;
document.addEventListener("click", async e=>{
  const lb=e.target.closest("button[data-l]"); if(lb){ const snap=snapshotForm(); lang=lb.dataset.l; try{localStorage.setItem("bv-lang",lang)}catch(_){}; render({keepScroll:true}); restoreForm(snap); return; }
  // same-hash link clicks don't fire hashchange: scroll manually
  const a=e.target.closest('a[href^="#"]');
  if(a && a.getAttribute("href")===location.hash){ e.preventDefault(); render(); return; }
  const mb=e.target.closest("[data-mbar='ask']"); if(mb){ askFor(mb.closest("#mbar").dataset.v); return; }
  const jump=e.target.closest("[data-jump]"); if(jump){ scrollToId(jump.dataset.jump, true); return; }
  const th=e.target.closest(".thumbs button"); if(th){ galShow(th.closest(".gallery"), +th.dataset.i); return; }
  const gn=e.target.closest(".gal-nav"); if(gn){ e.preventDefault(); const g=gn.classList.contains("lb-nav") ? lbGallery : gn.closest(".gallery"); if(g) galStep(g, +gn.dataset.dir); return; }
  const mi=e.target.closest(".main-img"); if(mi){ lbGallery=mi.closest(".gallery"); syncLb(); $("#lbImg").src=mi.src; $("#lbImg").alt=mi.alt; $("#lb").hidden=false; $("#lbClose").focus(); return; }
  if(e.target.closest("#lbClose")||e.target.id==="lb"){ $("#lb").hidden=true; return; }
  const box=e.target.closest(".cal-box");
  if(box){
    const vid=box.dataset.cal, admin=box.dataset.admin==="1";
    const nav=e.target.closest("[data-nav]"); if(nav){ const m=calMonth[vid]; calMonth[vid]=new Date(m.getFullYear(),m.getMonth()+(+nav.dataset.nav),1); box.outerHTML=calHtml(vid,admin); return; }
    const day=e.target.closest(".day"); if(day && !day.disabled){
      const k=day.dataset.d;
      if(admin){ const s=bookedSet(vid); s.has(k)?s.delete(k):s.add(k); AVAIL[vid]=toRanges(s); dirtyAdmin=true; render({keepScroll:true}); return; }
      const s=sel[vid]||(sel[vid]={});
      if(!s.a||s.b||k<s.a){ s.a=k; s.b=null; }
      else if(k===s.a){ s.a=null; }
      else if(rangeHasBooked(vid,s.a,k)){ box.outerHTML=calHtml(vid,false); const st=$('[data-cal="'+vid+'"] .cal-status'); st.textContent=t("cal_conflict"); st.classList.add("err"); return; }
      else s.b=k;
      box.outerHTML=calHtml(vid,false); updateMbar(vid);
      if(s.a&&s.b){ const f=$("#f-from"), tt=$("#f-to"); if(f&&tt){ f.value=s.a; tt.value=s.b; } prefill={a:s.a,b:s.b,vehicle:vid}; }
      return;
    }
    if(e.target.closest("[data-act='ask']")){ askFor(vid); return; }
  }
  if(e.target.closest("#saveAvail")) saveAvail();
  const cp=e.target.closest("[data-copy]"); if(cp){ const txt=$("#hoText").textContent;
    try{ await navigator.clipboard.writeText(txt); cp.textContent=t("ho_copied"); }catch(_){ const r=document.createRange(); r.selectNodeContents($("#hoText")); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r); } }
});
document.addEventListener("change", e=>{ if(e.target.id==="f-vehicle"){ const c=$("#xChecks"); if(c) c.innerHTML=extrasChecks(e.target.value); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("#lb").hidden) $("#lb").hidden=true; });

/* Inquiry message: written entirely in the visitor's selected language */
function buildMessage(d){
  const me=MSG_LABELS[lang]||MSG_LABELS.cs;
  const lines=[];
  lines.push(t("msg_hello")+" "+d.v.name+".");
  lines.push("");
  lines.push(me.dates+": "+fmt(d.a)+" – "+fmt(d.b)+" ("+(NIGHTS[lang]||NIGHTS.cs)(d.n)+")");
  lines.push(me.people+": "+d.people);
  if(d.extras.length) lines.push(me.extras+": "+d.extras.join(", "));
  lines.push(me.name+": "+d.name);
  if(d.email) lines.push(me.email+": "+d.email);
  if(d.phone) lines.push(me.phone+": "+d.phone);
  if(d.msg){ lines.push(""); lines.push(me.note+": "+d.msg); }
  lines.push(""); lines.push(t("msg_thanks"));
  return lines.join("\n");
}
document.addEventListener("submit", async e=>{
  if(e.target.id!=="inq") return; e.preventDefault();
  const g=id=>$("#"+id).value.trim();
  const name=g("f-name"), email=g("f-email"), phone=g("f-phone"), a=g("f-from"), b=g("f-to"), people=g("f-people"), vid=g("f-vehicle"), msg=g("f-msg");
  const err=$("#f-err"); err.hidden=true;
  if(!name||(!email&&!phone)||!a||!b){ err.textContent=t("f_err_req"); err.hidden=false; return; }
  if(b<=a){ err.textContent=t("f_err_order"); err.hidden=false; return; }
  if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err.textContent=t("f_err_email"); err.hidden=false; return; }
  if(phone && phone.replace(/\D/g,"").length<9){ err.textContent=t("f_err_phone"); err.hidden=false; return; }
  const bot=($("#f-bot")||{}).value||"";
  if(rangeHasBooked(vid,a,b)){ err.textContent=t("f_err_booked"); err.hidden=false; return; }
  const v=VEHICLES.find(x=>x.id===vid); const n=Math.round((fromIso(b)-fromIso(a))/864e5);
  const ex=[...document.querySelectorAll("#xChecks input:checked")].map(i=>{ const x=(v.extras||[]).find(e=>e.id===i.value); if(!x) return null;
    return L(x.name)+(x.ask?" ("+t("on_request")+")":""); }).filter(Boolean);
  const text=buildMessage({v,a,b,n,people,extras:ex,name,email,phone,msg});
  const subject=t("msg_subject")+" "+BRAND+": "+fmt(a)+" – "+fmt(b);
  const ho=$("#handoff");
  const fd=new URLSearchParams({"form-name":"poptavka","bot-field":bot,jmeno:name,email:email,telefon:phone,odjezd:a,navrat:b,noci:String(n),osob:people,vuz:v.name,doplnky:ex.join(", "),zprava:msg,jazyk:lang,text_poptavky:text});
  const sendBtn=e.target.querySelector('button[type="submit"]'); if(sendBtn){ sendBtn.disabled=true; sendBtn.textContent=t("ho_sending"); }
  let saved=false;
  try{ const r=await fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:fd.toString()}); saved=r.ok; }catch(_){ saved=false; }
  if(sendBtn){ sendBtn.disabled=false; sendBtn.textContent=t("f_submit"); }
  if(saved){ e.target.reset(); prefill=null; const xc=$("#xChecks"); if(xc) xc.innerHTML=extrasChecks(vid); }
  ho.innerHTML=(saved?'<p class="sent-ok">'+icon("check")+'<span>'+esc(t("ho_ok"))+'</span></p><b>'+esc(t("ho_ok_more"))+'</b>':'<b>'+esc(t("ho_title"))+'</b>')+'<pre id="hoText">'+esc(text)+'</pre>'+
    '<div class="btns" style="margin-top:0"><a class="btn btn-solid" id="waLink" target="_blank" rel="noopener" href="https://wa.me/'+CONTACT.whatsapp+'?text='+encodeURIComponent(text)+'">'+icon("wa")+esc(t("ho_wa"))+'</a>'+
    '<a class="btn btn-line" id="mailLink" href="mailto:'+CONTACT.email+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(text)+'">'+icon("mail")+esc(t("ho_mail"))+'</a>'+
    '<button type="button" class="btn btn-line" data-copy>'+esc(t("ho_copy"))+'</button></div><p class="fine">'+esc(t("ho_note"))+'</p>';
  ho.hidden=false; ho.scrollIntoView({block:"nearest"});
});

async function saveAvail(){
  const msg=$("#saveMsg"); msg.hidden=false; msg.textContent="Ukládám…";
  const data=JSON.stringify(AVAIL,null,1);
  if(!window.claude){
    try{ await navigator.clipboard.writeText(data); }catch(_){ window.prompt("Zkopírujte tento text:", data); }
    msg.innerHTML='Zkopírováno. <a href="https://github.com/misan-design/vandr-na-ctyrech-kolech/edit/main/obsazenost.json" target="_blank" rel="noopener">Otevřít obsazenost.json na GitHubu</a> → vše smazat → vložit (Ctrl+V) → Commit changes. Web se aktualizuje do 1–2 minut.';
    dirtyAdmin=false; return;
  }
  try{
    if(!artifactApi) throw {code:"not_granted"};
    await artifactApi.publish({"obsazenost.json":{content:data,contentType:"application/json"}});
    msg.textContent="Uloženo"; dirtyAdmin=false;
  }catch(err){
    const c=err&&err.code;
    if(c==="conflict") msg.textContent="Mezitím někdo uložil jinou verzi. Stránka se načte znovu.";
    else if(c==="rate_limited") msg.textContent="Ukládáte moc často. Zkuste to za chvíli.";
    else msg.textContent="Tady uložit nejde. Napište Claudovi, které dny jsou obsazené, a zapíše je.";
  }
}

async function loadAvail(){
  try{ const r=await fetch("obsazenost.json",{cache:"no-store"}); if(r.ok){ const j=await r.json(); if(j&&typeof j==="object") AVAIL=j; } }catch(_){}
  availLoaded=true;
  if(dirtyAdmin) return;
  if(parseRoute().page==="admin"){ render({keepScroll:true}); return; }
  document.querySelectorAll(".cal-box").forEach(b=>{ b.outerHTML=calHtml(b.dataset.cal, b.dataset.admin==="1"); });
}

render();
loadAvail();
(async()=>{
  if(!window.claude||!window.claude.use) return;
  try{ const user=await claude.use("user"); canEdit = user ? !!(await user.canEdit()) : false; }catch(_){ canEdit=false; }
  if(canEdit){ try{ artifactApi=await claude.use("artifact"); }catch(_){ artifactApi=null; } }
  renderChrome(parseRoute()); if(parseRoute().page==="admin") render({keepScroll:true});
})();
</script>
