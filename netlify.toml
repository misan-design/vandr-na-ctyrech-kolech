[build]
  publish = "."

[[headers]]
  for = "/obsazenost.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# interní soubory nezveřejňovat
[[redirects]]
  from = "/ROADMAP.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true
